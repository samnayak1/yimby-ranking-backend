name: yimby-ranking-backend

services:

  # Runs to completion before the backend boots.
  litestream-restore:
    image: litestream/litestream:0.3.13
    restart: "no"
    env_file:
      - .env
    environment:
      LITESTREAM_S3_PREFIX: ${LITESTREAM_S3_PREFIX:-yimby/database.sqlite}
      LITESTREAM_SYNC_INTERVAL: ${LITESTREAM_SYNC_INTERVAL:-1m}
    user: "1000:1000"
    volumes:
      - sqlite_data:/app/db
      - ./litestream.yml:/etc/litestream.yml:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        if [ -f /app/db/database.sqlite ]; then
          echo "litestream: database.sqlite present, skipping restore"
          exit 0
        fi
        echo "litestream: no local database, attempting restore from S3"
        litestream restore -if-replica-exists -config /etc/litestream.yml /app/db/database.sqlite
        echo "litestream: restore step complete"

  # streams the wal to s3 bucket
  litestream:
    image: litestream/litestream:0.3.13
    restart: unless-stopped

    mem_limit: 64m
    env_file:
      - .env
    environment:
      LITESTREAM_S3_PREFIX: ${LITESTREAM_S3_PREFIX:-yimby/database.sqlite}
      LITESTREAM_SYNC_INTERVAL: ${LITESTREAM_SYNC_INTERVAL:-5m}
    user: "1000:1000"
    volumes:
      - sqlite_data:/app/db
      - ./litestream.yml:/etc/litestream.yml:ro
    command: ["replicate", "-config", "/etc/litestream.yml"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      litestream-restore:
        condition: service_completed_successfully

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime

    restart: unless-stopped

    mem_limit: 384m

    env_file:
      - .env

    environment:
      NODE_ENV: production

    volumes:
      - sqlite_data:/app/db

    expose:
      - "3000"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

    depends_on:
      litestream-restore:
        condition: service_completed_successfully

  caddy:
    build:
      context: ./yimby-ranking-client
      dockerfile: Dockerfile
      args:
        VITE_COGNITO_USER_POOL_ID: ${VITE_COGNITO_USER_POOL_ID:?set in .env}
        VITE_COGNITO_CLIENT_ID: ${VITE_COGNITO_CLIENT_ID:?set in .env}

    restart: unless-stopped

    mem_limit: 128m

    environment:

      SITE_ADDRESS: ${SITE_ADDRESS:-:80}

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

    volumes:

      - caddy_data:/data
      - caddy_config:/config

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    depends_on:
      backend:
        condition: service_started

volumes:
  sqlite_data:
  caddy_data:
  caddy_config:
