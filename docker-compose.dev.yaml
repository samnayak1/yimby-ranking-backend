services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      # ts-node and the other devDependencies only exist in the build stage.
      target: build

    restart: unless-stopped

    environment:
      NODE_ENV: development

    volumes:
      - sqlite_data_dev:/app/db
      - .:/app
      - /app/node_modules

    expose:
      - "3000"

    command: npm run dev


  client:
    image: node:22

    working_dir: /app

    restart: unless-stopped

    environment:
      HMR_CLIENT_PORT: 80

    volumes:
      - ./yimby-ranking-client:/app
      - /app/node_modules

    expose:
      - "5173"

    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  nginx:
    image: nginx:alpine

    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - backend
      - client

volumes:
  sqlite_data_dev:
