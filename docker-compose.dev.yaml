
name: yimby-ranking-backend-dev

services:


  litestream-restore:
    image: litestream/litestream:0.3.13
    restart: "no"
    env_file:
      - .env
    environment:
      LITESTREAM_S3_PREFIX: ${LITESTREAM_DEV_S3_PREFIX:-yimby-dev/database.sqlite}
      LITESTREAM_SYNC_INTERVAL: ${LITESTREAM_SYNC_INTERVAL:-1m}
    volumes:
      - sqlite_data_dev:/app/db
      - ./litestream.yml:/etc/litestream.yml:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        if [ -f /app/db/database.sqlite ]; then
          echo "litestream: database.sqlite present, skipping restore"
          exit 0
        fi
        echo "litestream: no local database, attempting restore from S3"
        litestream restore -if-replica-exists -config /etc/litestream.yml /app/db/database.sqlite
        echo "litestream: restore step complete"

  litestream:
    image: litestream/litestream:0.3.13
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LITESTREAM_S3_PREFIX: ${LITESTREAM_DEV_S3_PREFIX:-yimby-dev/database.sqlite}
      LITESTREAM_SYNC_INTERVAL: ${LITESTREAM_SYNC_INTERVAL:-5m}
    volumes:
      - sqlite_data_dev:/app/db
      - ./litestream.yml:/etc/litestream.yml:ro
    command: ["replicate", "-config", "/etc/litestream.yml"]
    depends_on:
      litestream-restore:
        condition: service_completed_successfully

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 64m
    command:
      - redis-server
      - --maxmemory
      - 48mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    expose:
      - "6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: build

    restart: unless-stopped

    environment:
      NODE_ENV: development
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}

      NODE_OPTIONS: --max-old-space-size=1024

    volumes:
      - sqlite_data_dev:/app/db
      - .:/app
      - /app/node_modules

    expose:
      - "3000"

    command: npm run dev

    depends_on:
      litestream-restore:
        condition: service_completed_successfully
      redis:
        condition: service_started



  scraper:
    build:
      context: ./yimby-scraper
      dockerfile: Dockerfile

    profiles: ["scraper"]

    restart: "no"

    env_file:
      - .env
      - ./yimby-scraper/.env

    environment:
      DB_PATH: /data/database.sqlite

    volumes:
      - ./yimby-scraper:/app

      - sqlite_data_dev:/data
      - scraper_data_dev:/app/data

    depends_on:
      litestream-restore:
        condition: service_completed_successfully


  client:
    image: node:22

    working_dir: /app

    restart: unless-stopped

    environment:
      HMR_CLIENT_PORT: 80

    volumes:
      - ./yimby-ranking-client:/app
      - /app/node_modules

    expose:
      - "5173"

    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  nginx:
    image: nginx:alpine

    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - backend
      - client

volumes:
  sqlite_data_dev:
  scraper_data_dev:
